# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # 依存はすべて開発用なので、メジャー以外はまとめて1つの PR にする
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # engines.vscode より新しい型を使うと、存在しない API も使えてしまい、vsce もパッケージを作らない。
      # engines.vscode を上げるときに手で合わせる
      - dependency-name: '@types/vscode'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
